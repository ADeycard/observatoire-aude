<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Observatoire Social · Aude (11) · v7</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#edf2f7;color:#1a2845;font-size:13px;min-height:100vh}
/* NAV */
#nav{background:#1a4a6e;border-bottom:3px solid #ED7D31;padding:0 16px;display:flex;align-items:center;gap:0;height:54px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.18)}
#nav .brand{color:#fff;font-weight:700;font-size:14px;white-space:nowrap;margin-right:20px}
#nav .subtitle{color:#b8d4e8;font-size:11px;margin-right:auto}
.nav-tab{background:none;border:none;color:#c0d8ee;padding:0 14px;height:54px;cursor:pointer;font-size:13px;font-family:inherit;border-bottom:3px solid transparent;transition:all .15s}
.nav-tab:hover{color:#fff;background:#ffffff18}
.nav-tab.on{color:#FFB347;border-bottom-color:#FFB347;font-weight:600}
#nav .reload-btn{background:#0d3352;color:#7fb3f5;border:1px solid #2a6090;border-radius:5px;padding:5px 12px;cursor:pointer;font-size:12px;font-family:inherit;margin-left:12px;white-space:nowrap;transition:background .15s}
#nav .reload-btn:hover{background:#2a6090}
#nav .lastupd{color:#90b8d8;font-size:10px;margin-left:8px;white-space:nowrap}
#nav .branding{color:#90b8d8;font-size:10px;margin-left:12px;white-space:nowrap}
/* SECTIONS */
.section{display:none;padding:16px;min-height:calc(100vh - 54px)}
.section.on{display:block}
/* DASHBOARD */
#dash .theme-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.theme-btn{background:#fff;border:1px solid #c5d8ea;color:#4a6a8a;padding:5px 12px;border-radius:20px;cursor:pointer;font-size:12px;font-family:inherit;transition:all .15s;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.theme-btn:hover{background:#e8f2fa;color:#1a4a6e;border-color:#8ab0cc}
.theme-btn.on{background:#ED7D31;border-color:#ED7D31;color:#fff;font-weight:600;box-shadow:0 2px 6px rgba(237,125,49,.3)}
.theme-section{margin-bottom:20px}
.theme-header{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;padding:6px 12px;border-radius:4px;margin-bottom:10px;color:#fff}
.th-demographie{background:#1a5276}
.th-ages{background:#1a7a58}
.th-handicap{background:#6a3090}
.th-financier{background:#9a4a10}
.th-social{background:#1a5276}
.th-aude{background:#1a6060}
.th-ase{background:#c0570a}
.th-jeunesse{background:#c0570a}
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.card{background:#fff;border:1px solid #d0e2f0;border-radius:8px;padding:12px;cursor:pointer;transition:all .15s;position:relative;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.card:hover{border-color:#ED7D31;transform:translateY(-2px);box-shadow:0 4px 12px rgba(237,125,49,.2)}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.card-label{font-size:12px;color:#5a7a9a;flex:1;margin-right:8px;line-height:1.3}
.card-source{font-size:9px;color:#8aaBcc;white-space:nowrap}
.card-val{font-size:26px;font-weight:700;color:#1a2845;margin-bottom:4px}
.card-val span{font-size:13px;font-weight:400;color:#3a7abf;margin-left:4px}
.card-refs{display:flex;gap:10px;margin-bottom:8px;font-size:10px}
.card-ref-item{text-align:center}
.card-ref-val{color:#3a6a9a;font-weight:600}
.card-ref-lbl{color:#8aaabb;font-size:9px}
.card-ranks{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.rank-badge{font-size:10px;padding:2px 6px;border-radius:3px;background:#e8f0f8;border:1px solid #c0d8ec;color:#4a6a8a}
.rank-badge.good{background:#e8f8ee;border-color:#b0dcc0;color:#1a7a40}
.rank-badge.mid{background:#fffbe8;border-color:#ddd080;color:#8a7010}
.rank-badge.bad{background:#ffeaec;border-color:#e8b0b8;color:#c03040}
.card-stats{display:flex;gap:6px;font-size:9px;color:#8aaabb;flex-wrap:wrap;margin-top:4px}
.card-stat{background:#edf2f7;padding:2px 5px;border-radius:3px;white-space:nowrap}
.card-stat span{color:#3a7abf}
.card-new{position:absolute;top:6px;right:6px;background:#ED7D31;color:#fff;font-size:8px;padding:1px 4px;border-radius:2px;font-weight:700}
/* MODAL */
#modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:#00000055;z-index:200;align-items:center;justify-content:center}
#modal-overlay.on{display:flex}
#modal{background:#fff;border:1px solid #c0d8ec;border-radius:12px;padding:24px;max-width:560px;width:95%;max-height:85vh;overflow-y:auto;position:relative;box-shadow:0 8px 32px rgba(0,0,0,.15)}
#modal h3{color:#1a2845;font-size:16px;margin-bottom:4px}
#modal .modal-meta{font-size:11px;color:#7a9aaa;margin-bottom:16px}
.modal-close{position:absolute;top:12px;right:16px;background:none;border:none;color:#8aaabb;font-size:20px;cursor:pointer}
.modal-close:hover{color:#1a2845}
.modal-section{margin-bottom:16px}
.modal-section h4{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#3a7abf;margin-bottom:8px}
.modal-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.modal-stat-box{background:#edf2f7;border-radius:6px;padding:8px;text-align:center}
.modal-stat-val{font-size:15px;font-weight:700;color:#1a2845}
.modal-stat-lbl{font-size:9px;color:#7a9aaa;margin-top:2px}
.modal-rank-row{display:flex;justify-content:space-between;align-items:center;padding:6px 8px;border-radius:4px;margin-bottom:4px;font-size:12px}
.modal-rank-row:nth-child(odd){background:#f4f8fc}
/* CLASSEMENT */
#classement .controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
#classement .theme-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.ind-select-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.ind-btn{background:#fff;border:1px solid #c0d8ec;color:#5a7a9a;padding:4px 10px;border-radius:4px;cursor:pointer;font-size:11px;font-family:inherit;transition:all .15s}
.ind-btn:hover{background:#e8f2fa;border-color:#8ab0cc}
.ind-btn.on{background:#4472C4;border-color:#4472C4;color:#fff}
.dep-select{background:#fff;border:1px solid #c0d8ec;color:#1a2845;padding:5px 8px;border-radius:5px;font-size:12px;font-family:inherit;cursor:pointer}
#rank-table{width:100%;border-collapse:collapse;font-size:12px}
#rank-table th{background:#e8f0f8;color:#3a6a8a;padding:7px 8px;text-align:left;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em;border-bottom:2px solid #b8d0e8}
#rank-table td{padding:6px 8px;border-bottom:1px solid #e8f0f8;vertical-align:middle;color:#1a2845}
#rank-table tr:hover td{background:#f0f6fc}
#rank-table tr.aude-row td{background:#fff4ec !important;color:#c0570a !important;font-weight:700}
#rank-table tr.sel-row td{background:#f0f6fc !important;border-left:3px solid #4472C4 !important}
.gauge{background:#dce8f4;border-radius:3px;height:8px;position:relative;min-width:60px}
.gauge-fill{background:#4472C4;border-radius:3px;height:100%;transition:width .3s}
.gauge-fill.aude{background:#ED7D31}
/* scope buttons - Classement */
.scope-btn{background:#fff;border:1.5px solid #b8d0e8;color:#3a6a8a;padding:6px 16px;border-radius:20px;cursor:pointer;font-size:12px;font-family:inherit;font-weight:500;transition:all .15s;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.scope-btn:hover{background:#e8f2fa;border-color:#5a9ac4;color:#1a4a6e}
.scope-btn.on{background:#1a4a6e;border-color:#1a4a6e;color:#fff;font-weight:700;box-shadow:0 2px 8px rgba(26,74,110,.25)}
/* EVOLUTION */
#evolution .controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
#evo-chart{width:100%;background:#fff;border:1px solid #d0e2f0;border-radius:8px;padding:16px;min-height:360px;box-shadow:0 1px 4px rgba(0,0,0,.07)}
#evo-svg{width:100%;height:320px}
.evo-legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px;font-size:11px}
.evo-legend-item{display:flex;align-items:center;gap:5px}
.evo-legend-dot{width:10px;height:10px;border-radius:50%}
/* CARTE */
#carte .controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.map-wrap{display:flex;gap:16px;flex-wrap:wrap}
#map-svg-wrap{flex:1;min-width:280px;height:420px;background:#fff;border:1px solid #d0e2f0;border-radius:8px;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.map-svg path{stroke:#edf2f7;stroke-width:0.5;cursor:pointer;transition:opacity .1s}
.map-svg path.hl{stroke:#1a2845 !important;stroke-width:1.5}
.map-svg path:hover{opacity:.8}
#map-legend{width:160px;background:#fff;border:1px solid #d0e2f0;border-radius:8px;padding:12px;font-size:11px;align-self:flex-start;box-shadow:0 1px 4px rgba(0,0,0,.07)}
#map-legend h4{color:#3a7abf;margin-bottom:10px;font-size:11px;font-weight:600}
.legend-item{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.legend-swatch{width:18px;height:14px;border-radius:2px;flex-shrink:0}
#tooltip{position:fixed;background:#1a2845;border:1px solid #3a6a8a;border-radius:6px;padding:8px 10px;font-size:11px;pointer-events:none;display:none;z-index:150;max-width:180px;color:#fff}
/* EXPORT */
#export .export-themes{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.exp-theme-btn{background:#fff;border:1px solid #c0d8ec;color:#5a7a9a;padding:8px 14px;border-radius:6px;cursor:pointer;font-size:12px;font-family:inherit;transition:all .15s;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.exp-theme-btn:hover{background:#e8f2fa;border-color:#8ab0cc}
.exp-theme-btn.on{background:#4472C4;border-color:#4472C4;color:#fff}
.exp-options{background:#fff;border:1px solid #d0e2f0;border-radius:8px;padding:16px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.exp-options h4{color:#3a7abf;font-size:12px;font-weight:600;margin-bottom:10px}
.exp-opt-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:12px;color:#5a7a9a}
.exp-opt-row input[type=checkbox]{accent-color:#ED7D31}
.gen-pdf-btn{background:#ED7D31;color:#fff;border:none;border-radius:6px;padding:10px 24px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;box-shadow:0 2px 8px rgba(237,125,49,.3);transition:background .15s}
.gen-pdf-btn:hover{background:#c86820}
.gen-pdf-btn:disabled{background:#aaa;cursor:wait}
/* PDF Preview */
#pdf-preview-wrap{background:#fff;border:1px solid #d0e2f0;border-radius:8px;padding:0;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.10);overflow:hidden;display:none}
#pdf-preview-wrap.on{display:block}
#pdf-preview-header{background:#1a4a6e;color:#fff;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:600}
#pdf-preview-body{padding:16px;max-height:400px;overflow-y:auto;font-size:11px;color:#1a2845}
/* NOUVEAUTES */
#nouveautes .refresh-log{background:#fff;border:1px solid #d0e2f0;border-radius:8px;padding:16px;font-size:12px;max-height:400px;overflow-y:auto;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.log-entry{padding:6px 8px;border-bottom:1px solid #e8f0f8;display:flex;align-items:flex-start;gap:10px;font-size:11px}
.log-entry:last-child{border-bottom:none}
.log-ts{color:#7a9aaa;white-space:nowrap;min-width:100px}
.log-ico{font-size:14px}
.log-msg{color:#2a3a5a;flex:1}
.log-new{background:#e8f8ee}
/* API STATUS */
.api-status-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-bottom:20px}
.api-status-card{background:#fff;border:1px solid #d0e2f0;border-radius:8px;padding:12px;display:flex;align-items:center;gap:10px;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.api-status-icon{font-size:22px;flex-shrink:0}
.api-status-name{font-weight:700;font-size:12px;color:#1a2845}
.api-status-state{font-size:11px;margin-top:2px}
.api-ok{color:#1a8a40}
.api-err{color:#c03040}
.api-pend{color:#8a7010}
/* MISC */
.msg{text-align:center;color:#7a9aaa;padding:40px}
.msg .ico{font-size:40px;margin-bottom:10px}
.msg strong{display:block;color:#3a7abf;margin-bottom:6px}
.spinner{display:inline-block;width:12px;height:12px;border:2px solid #c0d8ec;border-top-color:#4472C4;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.badge-caf{background:#e8f8ee;color:#1a7a40;font-size:9px;padding:1px 5px;border-radius:3px;font-weight:700}
.badge-aude{background:#e8f0f8;color:#3a6a9a;font-size:9px;padding:1px 5px;border-radius:3px;font-weight:700}
.badge-drees{background:#f0e8f8;color:#7a30c0;font-size:9px;padding:1px 5px;border-radius:3px;font-weight:700}
.badge-insee{background:#e8f0f8;color:#3060a0;font-size:9px;padding:1px 5px;border-radius:3px;font-weight:700}

.card-tooltip{display:none;position:fixed;min-width:320px;max-width:420px;background:#1a2845;color:#fff;font-size:11px;padding:13px 15px;border-radius:8px;line-height:1.5;z-index:9999;box-shadow:0 6px 28px rgba(0,0,0,.3);pointer-events:none;white-space:normal}
.card-tooltip table{width:100%;border-collapse:collapse}
.card-tooltip td{padding:2px 4px;font-size:10.5px}
</style>
</head>

function fmt(val, format, unit) {
  if (val === null || val === undefined) return '—';
  switch(format) {
    case 'pct1':   return val.toFixed(1) + ' %';
    case 'dec1':   return val.toFixed(1) + (unit ? ' '+unit : '');
    case 'dec2':   return val.toFixed(2) + (unit ? ' '+unit : '');
    case 'int':    return Math.round(val).toLocaleString('fr-FR') + (unit ? ' '+unit : '');
    case 'eur0':   return Math.round(val).toLocaleString('fr-FR') + ' €';
    case 'keur':   return (val/1000).toFixed(1) + ' M€';
    default:       return val.toLocaleString('fr-FR') + (unit ? ' '+unit : '');
  }
}

function fmtShort(val, format) {
  if (val === null || val === undefined) return '—';
  switch(format) {
    case 'pct1':   return val.toFixed(1);
    case 'dec1':   return val.toFixed(1);
    case 'dec2':   return val.toFixed(2);
    case 'int':    return Math.round(val).toLocaleString('fr-FR');
    case 'eur0':   return Math.round(val).toLocaleString('fr-FR');
    case 'keur':   return (val/1000).toFixed(1) + ' M€';
    default:       return val.toFixed ? val.toFixed(2) : val;
  }
}

function rankClass(r, total) {
  if (!r || !total) return '';
  var pct = r / total;
  if (pct <= 0.33) return 'good';
  if (pct <= 0.67) return 'mid';
  return 'bad';
}

  // Rebuild MAP_CARTEABLE
  ALL_META.forEach(function(m) {
    if (DREES_SNAP[m.id] && Object.keys(DREES_SNAP[m.id]).length > 0) MAP_CARTEABLE[m.id] = true;
  });
}

function buildDash() {

  THEMES.forEach(function(th) {
    html += '<button class="theme-btn'+(th.id===currentThemeDash?' on':'')+'" data-theme-id="'+th.id+'" onclick="setThemeDash(this.dataset.themeId)">' + th.lbl + '</button>';
  });
  html += '</div>';
  html += '<div id="dash-cards"></div>';
  container.innerHTML = html;
  renderDashCards();
}

function setThemeDash(thId) {
  currentThemeDash = thId;
  document.querySelectorAll('#dash .theme-btn').forEach(function(b){
    b.classList.toggle('on', b.dataset.themeId === thId);
  });
  renderDashCards();
}

function renderDashCards() {
  // 'ase' theme now includes 'jeunesse' indicators
  function matchesTheme(m, thId) {
    if (!m.themes) return false;
    if (thId === 'ase') return m.themes.indexOf('ase') >= 0 || m.themes.indexOf('jeunesse') >= 0;
    return m.themes.indexOf(thId) >= 0;
  }
  var filtered = currentThemeDash === 'all' ? ALL_META : ALL_META.filter(function(m){ return matchesTheme(m, currentThemeDash); });
  
  // Group by theme - when filtering, use the active theme; when 'all', use themes[0]
  var byTheme = {};
  filtered.forEach(function(m) {
    var th;
    if (currentThemeDash !== 'all' && matchesTheme(m, currentThemeDash)) {
      th = currentThemeDash;
    } else {
      // Map jeunesse to ase for display grouping
      var t0 = (m.themes && m.themes[0]) || 'autre';
      th = t0 === 'jeunesse' ? 'ase' : t0;
    }
    if (!byTheme[th]) byTheme[th] = [];
    byTheme[th].push(m);
  });
  
  var themeOrder = ['demographie','ages','handicap','ase','jeunesse','pmi','financier','social','aude','autre'];
  var html = '';
  
  themeOrder.forEach(function(thId) {
    if (!byTheme[thId] || byTheme[thId].length === 0) return;
    var thInfo = THEMES.find(function(t){return t.id===thId;}) || {lbl:thId, cls:'th-social'};
    html += '<div class="theme-section">';
    html += '<div class="theme-header ' + (thInfo.cls||'th-social') + '">' + thInfo.lbl + '</div>';
    html += '<div class="cards-grid">';
    byTheme[thId].forEach(function(m) {
      html += buildCard(m);
    });
    html += '</div></div>';
  });
  
  if (!html) html = '<div class="msg"><div class="ico">📊</div><strong>Aucun indicateur</strong><p>Sélectionnez un thème ou rechargez les données.</p></div>';
  document.getElementById('dash-cards').innerHTML = html;
}

// ============================================================
// CARD TOOLTIP (position:fixed, ne se fait pas clipper)
// ============================================================
var _tipEl = null;
function _getTip() {
  if (!_tipEl) {
    _tipEl = document.createElement('div');
    _tipEl.className = 'card-tooltip';
    document.body.appendChild(_tipEl);
  }
  return _tipEl;
}
function showCardTip(e, card) {
  var tip = _getTip();
  var ttRaw = decodeURIComponent(card.dataset.tt || '');
  if (!ttRaw) return;
  tip.innerHTML = '<div style="font-size:11px;line-height:1.5">' + ttRaw + '</div>';
  tip.style.display = 'block';
  _positionTip(e);
}
function moveCardTip(e) {
  if (_tipEl && _tipEl.style.display === 'block') _positionTip(e);
}
function hideCardTip() {
  if (_tipEl) _tipEl.style.display = 'none';
}
function _positionTip(e) {
  var tip = _tipEl;
  var tw = tip.offsetWidth || 300, th = tip.offsetHeight || 200;
  var vw = window.innerWidth, vh = window.innerHeight;
  var x = e.clientX + 16, y = e.clientY - 20;
  if (x + tw > vw - 10) x = e.clientX - tw - 16;
  if (y + th > vh - 10) y = vh - th - 10;
  if (y < 10) y = 10;
  tip.style.left = x + 'px';
  tip.style.top  = y + 'px';
}


function buildCard(m) {
  var isNew = m.isNew ? '<div class="card-new">NOUVEAU</div>' : '';
  var srcBadge = '';
  if (m.source && m.source.indexOf('CAF') >= 0) srcBadge = '<span class="badge-caf">CAF</span>';
  else if (m.source && m.source.indexOf('Open Data Aude') >= 0) srcBadge = '<span class="badge-aude">AUDE</span>';
  else if (m.source && m.source.indexOf('DREES') >= 0) srcBadge = '<span class="badge-drees">DREES</span>';
  else if (m.source && m.source.indexOf('INSEE') >= 0) srcBadge = '<span class="badge-insee">INSEE</span>';
  
  var valFmt = fmt(m.aude, m.fmt, m.unit);
  
  // ── Rangs uniquement (visibles sur la carte) ──────────────
  var ranksHtml = '';
  if (m.rank_strate && m.total_strate)
    ranksHtml += '<span class="rank-badge ' + rankClass(m.rank_strate, m.total_strate) + '">Strate ' + m.rank_strate + '/' + m.total_strate + '</span>';
  if (m.rank_occ && m.total_occ)
    ranksHtml += '<span class="rank-badge ' + rankClass(m.rank_occ, m.total_occ) + '">Occ ' + m.rank_occ + '/' + m.total_occ + '</span>';
  if (m.rank_fr && m.total_fr)
    ranksHtml += '<span class="rank-badge ' + rankClass(m.rank_fr, m.total_fr) + '">France ' + m.rank_fr + '/' + m.total_fr + '</span>';
  
  // ── Tooltip au survol ──────────────────────────────────────────
  function ttStatsRow(label, s) {
    if (!s || s.mean === undefined || s.mean === null) return '';
    var u = m.unit ? ' '+m.unit : '';
    return '<tr>' +
      '<td style="color:#8ab;padding:2px 5px 2px 0;white-space:nowrap;font-size:10px">'+label+'</td>' +
      '<td style="padding:2px 3px;text-align:right">'+fmtShort(s.mean,m.fmt)+u+'</td>' +
      '<td style="padding:2px 3px;text-align:right;color:#ccd">'+fmtShort(s.median,m.fmt)+'</td>' +
      '<td style="padding:2px 3px;text-align:right;color:#99b">'+fmtShort(s.q1,m.fmt)+'</td>' +
      '<td style="padding:2px 3px;text-align:right;color:#99b">'+fmtShort(s.q3,m.fmt)+'</td>' +
      '</tr>';
  }
  var hasStats = (m.stats_strate&&m.stats_strate.mean!=null)||(m.stats_occ&&m.stats_occ.mean!=null)||(m.stats_fr&&m.stats_fr.mean!=null);
  var ttHtml = '';
  // Valeur Aude en tête
  if (m.aude !== undefined && m.aude !== null) {
    ttHtml += '<div style="font-size:13px;font-weight:700;color:#f4a44a;margin-bottom:5px">' +
      '&#x1F4CD; Aude : ' + fmt(m.aude, m.fmt, m.unit) + (m.annee ? ' <span style="font-size:9px;opacity:.7">('+m.annee+')</span>' : '') +
      '</div>';
  }
  // Définition
  if (m.desc) {
    ttHtml += '<div style="color:#ccd;font-size:10.5px;line-height:1.45;margin-bottom:6px;border-bottom:1px solid rgba(255,255,255,.12);padding-bottom:5px">'+m.desc+'</div>';
  }
  // Tableau statistiques
  if (hasStats) {
    ttHtml += '<div style="font-size:9.5px;color:#8ab;text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px">Statistiques comparatives</div>' +
      '<table style="width:100%;border-collapse:collapse;font-size:10.5px">' +
      '<thead><tr style="color:#8ab;font-size:9px">' +
        '<th style="text-align:left;padding-bottom:3px"></th>' +
        '<th style="text-align:right;padding:0 3px">Moy.</th>' +
        '<th style="text-align:right;padding:0 3px">Méd.</th>' +
        '<th style="text-align:right;padding:0 3px">Q1</th>' +
        '<th style="text-align:right;padding:0 3px">Q3</th>' +
      '</tr></thead><tbody>' +
      ttStatsRow('Strate ('+(m.stats_strate&&m.stats_strate.n||'?')+')', m.stats_strate) +
      ttStatsRow('Occitanie ('+(m.stats_occ&&m.stats_occ.n||'?')+')', m.stats_occ) +
      ttStatsRow('France ('+(m.stats_fr&&m.stats_fr.n||'?')+')', m.stats_fr) +
      '</tbody></table>' +
      '<div style="color:#7ab;font-size:9px;margin-top:3px">Unité : '+(m.unit||'—')+'</div>';
  }
  var tooltipHtml = ttHtml ? '<div class="card-tooltip">' + ttHtml + '</div>' : '';
  
  // Le tooltip est déclenché par JS (position:fixed) pour ne pas être clippé
  // On stocke le contenu dans data-tooltip et data-aude-val
  var audeValTxt = valFmt + (m.annee ? ' <span style="opacity:.6;font-size:10px">'+m.annee+'</span>' : '');
  var ttContent = ttHtml;
  
  return '<div class="card" data-ind-id="'+m.id+'"' +
    ' data-tt="'+encodeURIComponent(ttHtml)+'"' +
    ' data-aude-lbl="'+encodeURIComponent(m.label)+'"' +
    ' data-aude-val="'+encodeURIComponent(audeValTxt)+'"' +
    ' onmouseenter="showCardTip(event,this)" onmousemove="moveCardTip(event)" onmouseleave="hideCardTip()"' +
    ' onclick="openModal(this.dataset.indId)">' +
    isNew +
    '<div class="card-head"><div class="card-label">' + m.label + '</div><div>' + srcBadge + '</div></div>' +
    '<div class="card-val">' + valFmt + '<span>' + (m.annee || '') + '</span></div>' +
    (ranksHtml ? '<div class="card-ranks">' + ranksHtml + '</div>' : '') +
    '</div>';
}

function openModal(indId) {
  var m = ALL_META.find(function(x){return x.id===indId;});
  if (!m) return;
  
  var html = '<h3>' + m.label + '</h3>';
  html += '<div class="modal-meta">' + (m.source||'') + (m.annee ? ' · '+m.annee : '') + (m.unit ? ' · Unité: '+m.unit : '') + '</div>';
  
  if (m.desc) {
    html += '<div class="modal-section"><p style="color:#595959;font-size:12px;line-height:1.5">' + m.desc + '</p></div>';
  }
  
  // Values comparison
  html += '<div class="modal-section"><h4>Valeurs de référence</h4>';
  html += '<div class="modal-grid">';
  html += '<div class="modal-stat-box"><div class="modal-stat-val" style="color:#ED7D31">' + fmt(m.aude,m.fmt,m.unit) + '</div><div class="modal-stat-lbl">Aude (11)</div></div>';
  if (m.occ !== null && m.occ !== undefined) html += '<div class="modal-stat-box"><div class="modal-stat-val">' + fmt(m.occ,m.fmt,m.unit) + '</div><div class="modal-stat-lbl">Occitanie</div></div>';
  if (m.fra !== null && m.fra !== undefined) html += '<div class="modal-stat-box"><div class="modal-stat-val">' + fmt(m.fra,m.fmt,m.unit) + '</div><div class="modal-stat-lbl">France métro.</div></div>';
  html += '</div></div>';
  
  // Rankings
  if (m.rank_fr || m.rank_strate || m.rank_occ) {
    html += '<div class="modal-section"><h4>Classements (rang du + élevé au + bas)</h4>';
    if (m.rank_strate) html += '<div class="modal-rank-row"><span>Strate ('+m.total_strate+' depts)</span><span class="rank-badge '+rankClass(m.rank_strate,m.total_strate)+'">'+m.rank_strate+'/'+m.total_strate+'</span></div>';
    if (m.rank_occ) html += '<div class="modal-rank-row"><span>Occitanie ('+m.total_occ+' depts)</span><span class="rank-badge '+rankClass(m.rank_occ,m.total_occ)+'">'+m.rank_occ+'/'+m.total_occ+'</span></div>';
    if (m.rank_fr) html += '<div class="modal-rank-row"><span>France ('+m.total_fr+' depts)</span><span class="rank-badge '+rankClass(m.rank_fr,m.total_fr)+'">'+m.rank_fr+'/'+m.total_fr+'</span></div>';
    html += '</div>';
  }
  
  // Statistics by scope
  function statsBlock(title, sf) {
    if (!sf || !sf.mean) return '';
    return '<div class="modal-section"><h4>'+title+'</h4><div class="modal-grid">' +
      '<div class="modal-stat-box"><div class="modal-stat-val">'+fmtShort(sf.mean,m.fmt)+' '+m.unit+'</div><div class="modal-stat-lbl">Moyenne</div></div>' +
      '<div class="modal-stat-box"><div class="modal-stat-val">'+fmtShort(sf.median,m.fmt)+' '+m.unit+'</div><div class="modal-stat-lbl">Médiane</div></div>' +
      '<div class="modal-stat-box"><div class="modal-stat-val">'+fmtShort(sf.q1,m.fmt)+' '+m.unit+'</div><div class="modal-stat-lbl">1er quartile</div></div>' +
      '<div class="modal-stat-box"><div class="modal-stat-val">'+fmtShort(sf.q3,m.fmt)+' '+m.unit+'</div><div class="modal-stat-lbl">3e quartile</div></div>' +
      (sf.stdev ? '<div class="modal-stat-box"><div class="modal-stat-val">'+fmtShort(sf.stdev,m.fmt)+' '+m.unit+'</div><div class="modal-stat-lbl">Écart-type</div></div>' : '') +
      '<div class="modal-stat-box"><div class="modal-stat-val">'+sf.n+'</div><div class="modal-stat-lbl">Depts</div></div>' +
      '</div></div>';
  }
  if (m.stats_strate && m.stats_strate.mean) html += statsBlock('Statistiques — Strate', m.stats_strate);
  if (m.stats_occ && m.stats_occ.mean) html += statsBlock('Statistiques — Occitanie', m.stats_occ);
  if (m.stats_fr && m.stats_fr.mean) html += statsBlock('Statistiques — France métropolitaine', m.stats_fr);
  
  document.getElementById('modal-content').innerHTML = html;
  document.getElementById('modal-overlay').classList.add('on');
}

function closeModal(e) {
  if (!e || e.target === document.getElementById('modal-overlay') || e.currentTarget.classList.contains('modal-close')) {
    document.getElementById('modal-overlay').classList.remove('on');
  }
}

function setSelectedDept(code) {
  selectedDept = code || null;
  renderRankTable();
}

function renderRankTable() {
  var tbody = document.getElementById('rank-tbody');
  if (!tbody || !currentIndRank) {
    if (tbody) tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#888;padding:20px">Sélectionnez un indicateur</td></tr>';
    return;
  }
  var m = ALL_META.find(function(x){return x.id===currentIndRank;});
  if (!m) return;
  
  var snap = getSnap(currentIndRank) || DREES_SNAP[currentIndRank];
  var html = '';
  
  if (snap && Object.keys(snap).length) {
    // Full ranking from snap data
    // Apply scope filter
    var scopeCodes = null;
    if (currentRankScope === 'strate') scopeCodes = STRATE;
    else if (currentRankScope === 'occ') scopeCodes = OCC;
    var items = Object.keys(snap).map(function(c){
      return {code:c, name:DEPTS[c]||('Dép. '+c), val:snap[c]};
    }).filter(function(x){
      if (x.val === null || x.val === undefined) return false;
      if (x.code === 'FRA' || x.code === 'OCC') return false;
      if (scopeCodes && scopeCodes.indexOf(x.code) < 0) return false;
      return true;
    });
    items.sort(function(a,b){return b.val-a.val;});
    var maxVal = items[0] ? items[0].val : 1;
    
    items.forEach(function(item, i) {
      var isAude = item.code === '11';
      var isSel = selectedDept && item.code === selectedDept;
      var rowClass = isAude ? 'aude-row' : (isSel ? 'sel-row' : '');
      var pct = (item.val / maxVal * 100).toFixed(1);
      html += '<tr class="'+rowClass+'">' +
        '<td>'+(i+1)+'</td>' +
        '<td><strong>'+item.code+'</strong> '+item.name+'</td>' +
        '<td><strong>'+fmt(item.val,m.fmt,m.unit)+'</strong></td>' +
        '<td><div class="gauge"><div class="gauge-fill'+(isAude?' aude':'')+'" style="width:'+pct+'%"></div></div></td>' +
        '</tr>';
    });
  } else {
    // No snap: show Aude value + published ranks only
    var rankHtml = '';
    if (m.rank_fr) rankHtml += '<span class="rank-badge '+rankClass(m.rank_fr,m.total_fr)+'">France '+m.rank_fr+'/'+m.total_fr+'</span> ';
    if (m.rank_occ) rankHtml += '<span class="rank-badge '+rankClass(m.rank_occ,m.total_occ)+'">Occitanie '+m.rank_occ+'/'+m.total_occ+'</span> ';
    if (m.rank_strate) rankHtml += '<span class="rank-badge '+rankClass(m.rank_strate,m.total_strate)+'">Strate '+m.rank_strate+'/'+m.total_strate+'</span>';
    
    // Comparaison strate si dispo
    var stHtml = '';
    if (m.stats_strate && m.stats_strate.mean) {
      var sf = m.stats_strate;
      stHtml = '<tr><td colspan="5" style="padding:8px 12px;background:#f4f5f7;font-size:11px;color:#595959">' +
        '<strong>Strate ('+m.total_strate+' dép.) :</strong> Moy. '+fmtShort(sf.mean,m.fmt)+' '+m.unit +
        ' | Méd. '+fmtShort(sf.median,m.fmt)+' | Min '+fmtShort(sf.q1,m.fmt)+' | Max '+fmtShort(sf.q3,m.fmt) +
        '</td></tr>';
    }
    
    html = '<tr class="aude-row"><td>'+m.rank_fr+'</td>' +
      '<td><strong>11</strong> Aude</td>' +
      '<td><strong>'+fmt(m.aude,m.fmt,m.unit)+'</strong></td>' +
      '<td>'+rankHtml+'</td>' +
      '</tr>' + stHtml +
      '<tr><td colspan="5" style="text-align:center;color:#aaa;font-size:11px;font-style:italic;padding:12px">' +
      'Classement complet non disponible — données cartographiques uniquement pour les indicateurs PA/PH (ind01–ind11)' +
      '</td></tr>';
  }
  
  tbody.innerHTML = html;
  if (selectedDept) {
    var rows = tbody.querySelectorAll('.sel-row');
    if (rows.length) rows[0].scrollIntoView({behavior:'smooth', block:'nearest'});
  }
}

function drawEvoChart() {
  var svg = document.getElementById('evo-svg');
  var legend = document.getElementById('evo-legend');
  if (!svg || !currentIndEvo) return;
  var m = ALL_META.find(function(x){return x.id===currentIndEvo;});
  if (!m) return;
  
  // No TS: show info card with current value + ranks
  if (!DREES_TS[currentIndEvo]) {
    var rankHtml = '';
    if (m.rank_fr) rankHtml += '<span class="rank-badge '+rankClass(m.rank_fr,m.total_fr)+'">France '+m.rank_fr+'/'+m.total_fr+'</span> ';
    if (m.rank_occ) rankHtml += '<span class="rank-badge '+rankClass(m.rank_occ,m.total_occ)+'">Occitanie '+m.rank_occ+'/'+m.total_occ+'</span> ';
    if (m.rank_strate) rankHtml += '<span class="rank-badge '+rankClass(m.rank_strate,m.total_strate)+'">Strate '+m.rank_strate+'/'+m.total_strate+'</span>';
    svg.innerHTML = '';
    if (legend) legend.innerHTML = '<div style="padding:16px;background:#f4f5f7;border-radius:8px;font-size:12px;color:#595959;line-height:1.8">' +
      '<div style="font-size:20px;font-weight:800;color:#ED7D31;margin-bottom:4px">'+fmt(m.aude,m.fmt,m.unit)+'</div>' +
      '<div style="font-size:13px;color:#1a1a2e;font-weight:600;margin-bottom:6px">'+m.label+' — Aude (11)</div>' +
      '<div style="margin-bottom:6px">'+rankHtml+'</div>' +
      '<div style="color:#888;font-size:11px;font-style:italic">Série temporelle non disponible pour cet indicateur. Millésime '+m.annee+'.</div>' +
      '</div>';
    return;
  }
  
  var ts = DREES_TS[currentIndEvo];
  
  // Get Aude series
  var audeTs = ts['11'] || {};
  var years = Object.keys(audeTs).sort();
  if (!years.length) return;
  
  // Get OCC series: use ts['OCC'] if available, else compute mean from dept codes
  var occTs = {};
  if (ts['OCC']) {
    occTs = ts['OCC'];
  } else {
    years.forEach(function(y) {
      var vals = OCC.map(function(c){return ts[c] && ts[c][y];}).filter(function(v){return v !== null && v !== undefined;});
      if (vals.length) occTs[y] = vals.reduce(function(a,b){return a+b;},0) / vals.length;
    });
  }
  
  // Get compare dept series
  var compTs = selectedDeptEvo && ts[selectedDeptEvo] ? ts[selectedDeptEvo] : null;
  // If no snap for compare dept in TS, try to get a single point from snap data
  if (!compTs && selectedDeptEvo) {
    var compSnap = getSnap(currentIndEvo);
    if (compSnap && compSnap[selectedDeptEvo] !== undefined) {
      // Create single-point series
      var lastYear = years[years.length-1];
      compTs = {}; compTs[lastYear] = compSnap[selectedDeptEvo];
    }
  }
  
  var W = 700, H = 300, PL = 70, PR = 20, PT = 20, PB = 40;
  var cW = W - PL - PR, cH = H - PT - PB;
  
  // All values for scale
  var allVals = years.map(function(y){return audeTs[y];});
  years.forEach(function(y){if(occTs[y]) allVals.push(occTs[y]);});
  // Don't include FRA totals in scale if Aude is dept-level
  if (compTs) years.forEach(function(y){if(compTs[y]) allVals.push(compTs[y]);});
  
  var minV = Math.min.apply(null, allVals) * 0.95;
  var maxV = Math.max.apply(null, allVals) * 1.05;
  
  var yr0 = parseInt(years[0]), yr1 = parseInt(years[years.length-1]);
  function xPos(y) { return yr1 === yr0 ? PL + cW/2 : PL + (y - yr0) / (yr1 - yr0) * cW; }
  function yPos(v) { return (maxV === minV) ? PT + cH/2 : PT + cH - (v - minV) / (maxV - minV) * cH; }
  
  function makePath(tsData, color, dashed) {
    var pts = years.filter(function(y){return tsData[y]!==undefined && tsData[y]!==null;});
    if (!pts.length) return '';
    var d = pts.map(function(y,i){
      return (i===0?'M':'L') + xPos(parseInt(y)).toFixed(1) + ',' + yPos(tsData[y]).toFixed(1);
    }).join(' ');
    return '<path d="'+d+'" fill="none" stroke="'+color+'" stroke-width="'+(dashed?1.5:2.5)+'" '+(dashed?'stroke-dasharray="5,3"':'')+' />';
  }
  
  var svgHtml = '';
  
  // Grid lines
  var yTicks = 5;
  for (var i = 0; i <= yTicks; i++) {
    var yVal = minV + (maxV - minV) * i / yTicks;
    var y = yPos(yVal);
    svgHtml += '<line x1="'+PL+'" y1="'+y.toFixed(1)+'" x2="'+(W-PR)+'" y2="'+y.toFixed(1)+'" stroke="#dde1e7" stroke-width="1" />';
    svgHtml += '<text x="'+(PL-5)+'" y="'+(y+4).toFixed(1)+'" fill="#888" font-size="9" text-anchor="end">'+fmtShort(yVal, m.fmt)+'</text>';
  }
  
  // Year labels
  var step = years.length > 20 ? 5 : years.length > 10 ? 2 : 1;
  years.forEach(function(y, i) {
    if (i % step !== 0) return;
    var x = xPos(parseInt(y));
    svgHtml += '<text x="'+x.toFixed(1)+'" y="'+(H-PB+15)+'" fill="#888" font-size="9" text-anchor="middle">'+y+'</text>';
  });
  
  // Lines
  // Get FRA series - only show if same scale as Aude (not national totals)
  var fraTs = ts['FRA'] || {};
  var fraVals = Object.values(fraTs).filter(function(v){return v!=null;});
  var audeVals2 = Object.values(audeTs).filter(function(v){return v!=null;});
  var fraAvg = fraVals.length ? fraVals.reduce(function(a,b){return a+b;},0)/fraVals.length : 0;
  var audeAvg = audeVals2.length ? audeVals2.reduce(function(a,b){return a+b;},0)/audeVals2.length : 1;
  var fraHasData = fraVals.length > 0 && fraAvg / audeAvg < 50; // Skip if FRA is national total (>>50x Aude)
  
  if (fraHasData) allVals = allVals.concat(fraVals);
  
  svgHtml += makePath(occTs, '#2E7D32', true);
  if (fraHasData) svgHtml += makePath(fraTs, '#4472C4', true);
  if (compTs) svgHtml += makePath(compTs, '#bb80f0', true);
  svgHtml += makePath(audeTs, '#ED7D31', false);
  
  // Aude dots (last point)
  var lastY = years[years.length - 1];
  if (audeTs[lastY] !== undefined) {
    var lx = xPos(parseInt(lastY)), ly = yPos(audeTs[lastY]);
    svgHtml += '<circle cx="'+lx.toFixed(1)+'" cy="'+ly.toFixed(1)+'" r="4" fill="#ED7D31" />';
  }
  
  svg.innerHTML = svgHtml;
  
  // Legend
  var legHtml = '<div class="evo-legend-item"><div class="evo-legend-dot" style="background:#ED7D31"></div>Aude (11)</div>';
  legHtml += '<div class="evo-legend-item"><div class="evo-legend-dot" style="background:#2E7D32;opacity:.7;border:1px dashed #2E7D32"></div>Moy. Occitanie</div>';
  legHtml += '<div class="evo-legend-item"><div class="evo-legend-dot" style="background:#4472C4;opacity:.7;border:1px dashed #4472C4"></div>France</div>';
  if (selectedDeptEvo) legHtml += '<div class="evo-legend-item"><div class="evo-legend-dot" style="background:#bb80f0"></div>' + (DEPTS[selectedDeptEvo]||selectedDeptEvo) + '</div>';
  legend.innerHTML = legHtml;
}

function loadGeo() {
  if (geoCache) { buildSVGMap(geoCache); colorMap(); return; }
  fetch('https://raw.githubusercontent.com/gregoiredavid/france-geojson/master/departements-version-simplifiee.geojson')
    .then(function(r){ return r.json(); })
    .then(function(geo) {
      geoCache = geo;
      mapBuilt = true;
      buildSVGMap(geo);
      colorMap();
    })
    .catch(function() {
      var wrap = document.getElementById('map-svg-wrap');
      if (wrap) wrap.innerHTML = '<div class="msg"><div class="ico">🌐</div><strong>Carte indisponible</strong><p>Connexion internet requise.</p></div>';
    });
}

function buildSVGMap(geo) {
  var W=560, H=460;
  var lonMin=-5.3,lonMax=9.8,latMin=41.2,latMax=51.2;
  function proj(lon,lat){ return [(lon-lonMin)/(lonMax-lonMin)*W, H-(lat-latMin)/(latMax-latMin)*H]; }
  function rings2path(rings) {
    return rings.map(function(ring){
      return ring.map(function(p,i){ var xy=proj(p[0],p[1]); return (i?'L':'M')+xy[0].toFixed(1)+','+xy[1].toFixed(1); }).join('')+' Z';
    }).join(' ');
  }
  var parts = ['<svg class="map-svg" viewBox="0 0 '+W+' '+H+'" style="width:100%;height:100%;max-height:100%">'];
  geo.features.forEach(function(f){
    var raw=f.properties.code; if(!raw) return;
    var code=raw.length===1?'0'+raw:raw;
    var d='';
    if(f.geometry.type==='Polygon') d=rings2path(f.geometry.coordinates);
    else if(f.geometry.type==='MultiPolygon') d=f.geometry.coordinates.map(rings2path).join(' ');
    if(!d) return;
    parts.push('<path data-code="'+code+'" d="'+d+'" fill="#2a3560"'+(code==='11'?' class="hl"':'')+' />');
  });
  parts.push('</svg>');
  var wrap = document.getElementById('map-svg-wrap');
  if (wrap) {
    wrap.innerHTML = parts.join('');
    var tt = document.getElementById('tooltip');
    wrap.querySelectorAll('path[data-code]').forEach(function(path){
      path.addEventListener('mousemove', function(e){
        var code=path.dataset.code;
        if (!currentIndCarte || !DREES_SNAP[currentIndCarte]) return;
        var val=DREES_SNAP[currentIndCarte][code];
        var m=ALL_META.find(function(x){return x.id===currentIndCarte;});
        tt.style.display='block';
        tt.style.left=(e.clientX+14)+'px';
        tt.style.top=(e.clientY-30)+'px';
        tt.innerHTML='<strong>'+(DEPTS[code]||code)+'</strong> ('+code+')<br>'+(m?fmt(val,m.fmt,m.unit):'—');
      });
      path.addEventListener('mouseleave', function(){tt.style.display='none';});
      path.addEventListener('click', function(){
        var code=path.dataset.code;
        var m=ALL_META.find(function(x){return x.id===currentIndCarte;});
        if(m) openModal(m.id);
      });
    });
  }
}

function colorMap() {
  if (!mapBuilt || !currentIndCarte) return;
  var snap = DREES_SNAP[currentIndCarte];
  var m = ALL_META.find(function(x){return x.id===currentIndCarte;});
  if (!snap || !m) return;
  
  var wrap = document.getElementById('map-svg-wrap');
  if (!wrap || !wrap.querySelector('svg')) return;
  
  var vals = Object.values(snap).filter(function(v){return v!==null&&v!==undefined;});
  if (!vals.length) return;
  
  var minV=Math.min.apply(null,vals), maxV=Math.max.apply(null,vals);
  var colors = ['#1a3a6a','#2060a0','#4090d0','#69B8F0','#FFA040','#ED7D31','#c85020','#8B1A00'];
  
  function getColor(val) {
    if (val===null||val===undefined) return '#2a3560';
    var t=(val-minV)/(maxV-minV||1);
    var idx=Math.min(Math.floor(t*(colors.length-1)), colors.length-2);
    var frac=t*(colors.length-1)-idx;
    function hexToRgb(h){var r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);return[r,g,b];}
    function lerp(a,b,t){return Math.round(a+(b-a)*t);}
    var c1=hexToRgb(colors[idx]), c2=hexToRgb(colors[idx+1]);
    return 'rgb('+lerp(c1[0],c2[0],frac)+','+lerp(c1[1],c2[1],frac)+','+lerp(c1[2],c2[2],frac)+')';
  }
  
  wrap.querySelectorAll('path[data-code]').forEach(function(path){
    var code=path.dataset.code;
    var val=snap[code];
    path.setAttribute('fill', getColor(val));
    if (code==='11') { path.setAttribute('stroke','#ffffff'); path.setAttribute('stroke-width','1.5'); }
    else { path.setAttribute('stroke','#fff'); path.setAttribute('stroke-width','0.5'); }
  });
  
  // Legend
  var legEl=document.getElementById('legend-items');
  if (legEl) {
    var steps=6;
    var legHtml='';
    for(var i=steps;i>=0;i--){
      var v=minV+(maxV-minV)*i/steps;
      legHtml+='<div class="legend-item"><div class="legend-swatch" style="background:'+getColor(v)+'"></div>' +
        '<span>'+fmtShort(v,m.fmt)+(m.unit?' '+m.unit:'')+'</span></div>';
    }
    legEl.innerHTML=legHtml;
  }
}

async function loadCAF() {
  try {
    addLog('⏳', 'Chargement CAF (données mensuelles département 11)...');
    var url = 'https://data.caf.fr/api/explore/v2.1/catalog/datasets/s_ben_dep-copy/records?limit=100&where=numdep%3D%2211%22&order_by=dtreffre%20DESC';
    var r = await fetch(url);
    if (!r.ok) throw new Error('CAF HTTP '+r.status);
    var data = await r.json();
    if (!data.results || !data.results.length) throw new Error('CAF: 0 résultats');
    
    // Take most recent record
    var rec = data.results[0];
    var dateRef = rec.dtreffre || 'inconnue';
    
    // Build CAF meta from all fields
    var prevIds = CAF_META.map(function(m){return m.id;});
    CAF_META = [];
    
    var CAF_FIELDS = [
      {key:'indfoy_rsa', label:'Foyers RSA', fmt:'int', unit:'foyers', themes:['social','financier']},
      {key:'indmtt_rsa', label:'Montant RSA versé', fmt:'eur0', unit:'€', themes:['social','financier']},

      {key:'indben_ajpa', label:'Bénéficiaires AJPA', fmt:'int', unit:'', themes:['ages']},
      {key:'indmtt_ajpa', label:'Montant AJPA versé', fmt:'eur0', unit:'€', themes:['ages','financier']},
      {key:'indben_ajpp', label:'Bénéficiaires AJPP', fmt:'int', unit:'', themes:['handicap']},
      {key:'indfoy_apl', label:'Foyers APL', fmt:'int', unit:'foyers', themes:['social']},
      {key:'indmtt_apl', label:'Montant APL versé', fmt:'eur0', unit:'€', themes:['social','financier']},
      {key:'indfoy_alf', label:'Foyers ALF', fmt:'int', unit:'foyers', themes:['social']},
      {key:'indfoy_als', label:'Foyers ALS', fmt:'int', unit:'foyers', themes:['social']},
      {key:'indfoy_af', label:'Foyers allocations familiales', fmt:'int', unit:'foyers', themes:['social']},
      {key:'indmtt_af', label:'Montant AF versé', fmt:'eur0', unit:'€', themes:['social','financier']},

      {key:'indmtt_ppa', label:'Montant PPA versé', fmt:'eur0', unit:'€', themes:['social','financier']},
    ];
    
    CAF_FIELDS.forEach(function(f) {

        id: 'caf_'+f.key,
        label: f.label,
        unit: f.unit,
        fmt: f.fmt,
        themes: f.themes,
        aude: val,
        occ: null, fra: null,
        rank_fr: null, rank_strate: null, rank_occ: null,
        total_fr: 96, total_strate: 11, total_occ: 13,
        stats_fr: {}, stats_strate: {}, stats_occ: {},
        has_ts: false,
        source: 'CAF — données mensuelles',
        annee: dateRef,
        desc: 'Donn\u00e9e mensuelle CAF pour le d\u00e9partement de l\'Aude. P\u00e9riode de r\u00e9f\u00e9rence: '+dateRef+'.',
        isNew: isNew && prevIds.length > 0
      });
    });
    
    addLog('✅', 'CAF chargée: '+CAF_META.length+' indicateurs (période: '+dateRef+')', true);
  } catch(e) {
    addLog('❌', 'CAF erreur: '+e.message);
  }
}

async function loadAude() {
  var datasets = [
    {url:'cd11_etablissements_pa', label:'Établissements PA', themes:['ages','aude']},
    {url:'cd11_etablissements_ph', label:'Établissements PH', themes:['handicap','aude']},
    {url:'cd11_eaje', label:'Établissements EAJE', themes:['social','aude']},
    {url:'cd11_mds', label:'Maisons De la Solidarité', themes:['social','aude']},
  ];
  
  for (var i=0; i<datasets.length; i++) {
    var ds = datasets[i];
    try {
      var r = await fetch('https://opendata.aude.fr/api/explore/v2.1/catalog/datasets/'+ds.url+'/records?limit=1');
      if (!r.ok) throw new Error('HTTP '+r.status);
      var data = await r.json();
      var count = data.total_count || 0;
      
      // Check if already in AUDE_META
      var existing = AUDE_META.find(function(m){return m.id==='aude_'+ds.url;});
      var isNew = !existing;
      if (isNew && AUDE_META.length > 0) newCount++;
      
      if (existing) {
        existing.aude = count;
        existing.annee = new Date().getFullYear();
      } else {
        AUDE_META.push({
          id: 'aude_'+ds.url,
          label: ds.label+' (nb)',
          unit: 'établissements',
          fmt: 'int',
          themes: ds.themes,
          aude: count,
          occ: null, fra: null,
          rank_fr: null, rank_strate: null, rank_occ: null,
          total_fr: 96, total_strate: 11, total_occ: 13,
          stats_fr: {}, stats_strate: {}, stats_occ: {},
          has_ts: false,
          source: 'Open Data Aude — opendata.aude.fr',
          annee: new Date().getFullYear(),
          desc: 'Nombre d\''+ds.label+' dans le d\u00e9partement de l\'Aude. Source: opendata.aude.fr.',
          isNew: isNew
        });
      }
      addLog('✅', ds.label+': '+count+' établissements', true);
    } catch(e) {
      addLog('❌', ds.label+' erreur: '+e.message);
    }
  }
}

function buildNouveautes() {
  var container = document.getElementById('nouveautes');
  var html = '<h2 style="color:#4472C4;margin-bottom:12px;font-size:15px">Journal de rechargement</h2>';
  
  if (!refreshLog.length) {
    html += '<div class="msg"><div class="ico">🔔</div><strong>Aucun rechargement</strong><p>Appuyez sur « ⚡ Recharger données » pour charger les données live (CAF + Open Data Aude)</p></div>';
  } else {
    html += '<div class="refresh-log">';
    refreshLog.forEach(function(e) {
      html += '<div class="log-entry'+(e.isNew?' log-new':'')+'">' +
        '<div class="log-ts">'+e.ts+'</div>' +
        '<div class="log-ico">'+e.ico+'</div>' +
        '<div class="log-msg">'+e.msg+(e.isNew?' <strong style="color:#ED7D31">NOUVEAU</strong>':'')+'</div>' +
        '</div>';
    });
    html += '</div>';
  }
  container.innerHTML = html;
}

// ============================================================
// EXPORT PDF
// ============================================================
function buildExport() {
  var container = document.getElementById('export');
  
  var themeHTML = '<h2 style="color:#4472C4;margin-bottom:12px;font-size:15px">Export PDF</h2>';
  themeHTML += '<p style="color:#595959;font-size:12px;margin-bottom:16px">Sélectionnez un ou plusieurs thèmes, puis générez un rapport PDF complet avec un indicateur par page.</p>';
  themeHTML += '<div class="export-themes">';
  THEMES.filter(function(t){return t.id!=='all';}).forEach(function(th) {
    themeHTML += '<button class="exp-theme-btn" id="exp-'+th.id+'" data-theme-id="'+th.id+'" onclick="toggleExpTheme(this.dataset.themeId)">' + th.lbl + '</button>';
  });
  themeHTML += '</div>';
  
  themeHTML += '<div class="exp-options"><h4>Options</h4>' +
    '<div class="exp-opt-row"><input type="checkbox" id="opt-stats" checked> <label for="opt-stats">Inclure les statistiques (moyenne, médiane, quartiles)</label></div>' +
    '<div class="exp-opt-row"><input type="checkbox" id="opt-chart" checked> <label for="opt-chart">Inclure l\'histogramme de la strate</label></div>' +
    '<div class="exp-opt-row"><input type="checkbox" id="opt-source" checked> <label for="opt-source">Citer les sources et l\'ann\u00e9e</label></div>' +
    '</div>';
  
  themeHTML += '<button class="gen-pdf-btn" id="gen-pdf-btn" onclick="generatePDF()">📄 Générer le PDF</button>';
  themeHTML += '<div id="pdf-status" style="margin-top:10px;font-size:12px;color:#595959"></div>';
  
  container.innerHTML = themeHTML;
  window._expThemes = [];
}

function toggleExpTheme(thId) {
  if (!window._expThemes) window._expThemes = [];
  var idx = window._expThemes.indexOf(thId);
  if (idx >= 0) window._expThemes.splice(idx, 1);
  else window._expThemes.push(thId);
  document.getElementById('exp-'+thId).classList.toggle('on', idx < 0);
}

function generatePDF() {
  var themes = window._expThemes || [];
  if (!themes.length) { alert('Sélectionnez au moins un thème.'); return; }
  
  var btn = document.getElementById('gen-pdf-btn');
  btn.disabled = true;
  btn.textContent = '⏳ Génération...';
  document.getElementById('pdf-status').textContent = 'Chargement de jsPDF...';
  
  // Load jsPDF
  var script = document.createElement('script');
  script.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
  script.onload = function() { doPDF(themes); };
  script.onerror = function() {
    btn.disabled = false;
    btn.textContent = '📄 Générer le PDF';
    document.getElementById('pdf-status').textContent = '❌ Impossible de charger jsPDF (connexion internet requise)';
  };
  document.head.appendChild(script);
}

function doPDF(themes) {
  var btn = document.getElementById('gen-pdf-btn');
  var status = document.getElementById('pdf-status');
  
  try {
    var jsPDF = window.jspdf.jsPDF;
    var doc = new jsPDF({orientation:'portrait', unit:'mm', format:'a4'});
    var W = 210, H = 297;
    var now = new Date().toLocaleDateString('fr-FR', {year:'numeric',month:'long',day:'numeric'});
    
    // Filter indicators by themes
    var indicators = ALL_META.filter(function(m){
      return m.themes && m.themes.some(function(t){ return themes.indexOf(t) >= 0; });
    });
    
    var themeLabels = themes.map(function(t){ return THEMES.find(function(x){return x.id===t;}).lbl; });
    
    // ---- Page de garde ----
    doc.setFillColor(15, 22, 41);
    doc.rect(0, 0, W, H, 'F');
    
    doc.setFillColor(10, 15, 30);
    doc.rect(0, 0, W, 60, 'F');
    
    doc.setFillColor(237, 125, 49);
    doc.rect(0, 58, W, 3, 'F');
    
    doc.setTextColor(127, 179, 245);
    doc.setFontSize(11);
    doc.text('D\u00c9PARTEMENT DE L\'AUDE (11)', 20, 25);
    
    doc.setTextColor(255, 255, 255);
    doc.setFontSize(22);
    doc.setFont(undefined, 'bold');
    doc.text('Observatoire Social', 20, 38);
    
    doc.setFontSize(14);
    doc.setFont(undefined, 'normal');
    doc.setTextColor(200, 210, 240);
    doc.text('Thèmes : ' + themeLabels.join(', '), 20, 50);
    
    doc.setFillColor(30, 50, 100);
    doc.rect(15, 75, W - 30, 40, 'F');
    doc.setTextColor(127, 179, 245);
    doc.setFontSize(10);
    doc.text('Informations du rapport', 20, 85);
    doc.setTextColor(200, 210, 240);
    doc.setFontSize(9);
    doc.text('Date d\'export : ' + now, 20, 93);
    doc.text('Nombre d\'indicateurs : ' + indicators.length, 20, 100);
    doc.text('Sources : DREES, INSEE, CAF, Open Data Aude', 20, 107);
    
    doc.setFillColor(30, 50, 80);
    doc.rect(15, H-60, W-30, 20, 'F');
    doc.setTextColor(74, 106, 153);
    doc.setFontSize(8);
    doc.text('Contr\u00f4le de Gestion \u2014 D\u00e9partement de l\'Aude', 20, H-48);
    doc.text('Ce document a été généré automatiquement par intelligence artificielle (Claude, Anthropic).', 20, H-42);
    doc.text('Les données proviennent de sources officielles. Vérifier les données avant toute publication.', 20, H-36);
    
    // ---- Pages indicateurs ----
    var includeStats = document.getElementById('opt-stats') && document.getElementById('opt-stats').checked;
    var includeChart = document.getElementById('opt-chart') && document.getElementById('opt-chart').checked;
    var includeSource = document.getElementById('opt-source') && document.getElementById('opt-source').checked;
    
    indicators.forEach(function(m, idx) {
      doc.addPage();
      var yp = 0;
      
      // Header
      doc.setFillColor(10, 15, 30);
      doc.rect(0, 0, W, 20, 'F');
      doc.setFillColor(237, 125, 49);
      doc.rect(0, 18, W, 2, 'F');
      
      doc.setTextColor(127, 179, 245);
      doc.setFontSize(8);
      doc.setFont(undefined, 'normal');
      doc.text('Observatoire Social · Aude (11)', 10, 9);
      doc.text('Page '+(idx+2)+' / '+(indicators.length+1), W-30, 9);
      
      doc.setTextColor(200, 210, 240);
      doc.setFontSize(14);
      doc.setFont(undefined, 'bold');
      doc.text(m.label, 10, 32);
      
      doc.setFontSize(8);
      doc.setFont(undefined, 'normal');
      doc.setTextColor(74, 106, 153);
      if (m.themes) doc.text('Thème : '+m.themes.map(function(t){var th=THEMES.find(function(x){return x.id===t;});return th?th.lbl:t;}).join(', '), 10, 39);
      
      yp = 48;
      
      // Description
      if (m.desc) {
        doc.setTextColor(150, 170, 200);
        doc.setFontSize(8);
        var lines = doc.splitTextToSize(m.desc, W - 20);
        doc.text(lines, 10, yp);
        yp += lines.length * 4 + 4;
      }
      
      // Source
      if (includeSource && m.source) {
        doc.setTextColor(74, 106, 153);
        doc.setFontSize(7);
        doc.text('Source : ' + m.source + (m.annee ? ' · ' + m.annee : ''), 10, yp);
        yp += 6;
      }
      
      // Main values box
      var boxY = yp;
      doc.setFillColor(19, 30, 53);
      doc.rect(10, boxY, W - 20, 36, 'F');
      
      // Aude value
      doc.setFillColor(50, 25, 0);
      doc.rect(12, boxY+2, 58, 32, 'F');
      doc.setTextColor(237, 125, 49);
      doc.setFontSize(18);
      doc.setFont(undefined, 'bold');
      var audeStr = fmtShort(m.aude, m.fmt) + (m.unit ? ' ' + m.unit : '');
      doc.text(audeStr, 41, boxY+16, {align:'center'});
      doc.setFontSize(7);
      doc.setFont(undefined, 'normal');
      doc.setTextColor(150, 130, 100);
      doc.text('AUDE (11)', 41, boxY+24, {align:'center'});
      
      // Occ
      if (m.occ !== null && m.occ !== undefined) {
        doc.setTextColor(180, 200, 230);
        doc.setFontSize(12);
        doc.setFont(undefined, 'bold');
        doc.text(fmtShort(m.occ, m.fmt) + (m.unit ? ' ' + m.unit : ''), 100, boxY+16, {align:'center'});
        doc.setFontSize(7);
        doc.setFont(undefined, 'normal');
        doc.setTextColor(74, 106, 153);
        doc.text('Occitanie', 100, boxY+24, {align:'center'});
      }
      
      // France
      if (m.fra !== null && m.fra !== undefined) {
        doc.setTextColor(180, 200, 230);
        doc.setFontSize(12);
        doc.setFont(undefined, 'bold');
        doc.text(fmtShort(m.fra, m.fmt) + (m.unit ? ' ' + m.unit : ''), 160, boxY+16, {align:'center'});
        doc.setFontSize(7);
        doc.setFont(undefined, 'normal');
        doc.setTextColor(74, 106, 153);
        doc.text('France métro.', 160, boxY+24, {align:'center'});
      }
      
      yp = boxY + 42;
      
      // Ranks
      if (m.rank_fr || m.rank_strate || m.rank_occ) {
        doc.setTextColor(127, 179, 245);
        doc.setFontSize(8);
        doc.setFont(undefined, 'bold');
        doc.text('Classements', 10, yp); yp += 5;
        doc.setFont(undefined, 'normal');
        doc.setFontSize(8);
        doc.setTextColor(180, 200, 230);
        if (m.rank_strate) { doc.text('Strate: ' + m.rank_strate + '/' + m.total_strate, 10, yp); }
        if (m.rank_occ) { doc.text('Occitanie: ' + m.rank_occ + '/' + m.total_occ, 70, yp); }
        if (m.rank_fr) { doc.text('France: ' + m.rank_fr + '/' + m.total_fr, 140, yp); }
        yp += 8;
      }
      
      // Stats
      if (includeStats) {
        var statsGroups = [
          {lbl:'Statistiques France', sf: m.stats_fr},
          {lbl:'Statistiques Occitanie', sf: m.stats_occ},
          {lbl:'Statistiques Strate', sf: m.stats_strate},
        ];
        statsGroups.forEach(function(sg) {
          if (!sg.sf || !sg.sf.mean) return;
          doc.setTextColor(127, 179, 245);
          doc.setFontSize(8);
          doc.setFont(undefined, 'bold');
          doc.text(sg.lbl, 10, yp); yp += 5;
          doc.setFont(undefined, 'normal');
          doc.setFontSize(8);
          doc.setTextColor(180, 200, 230);
          doc.text(
            'Moy: '+fmtShort(sg.sf.mean,m.fmt)+m.unit+
            '  Méd: '+fmtShort(sg.sf.median,m.fmt)+m.unit+
            '  Q1: '+fmtShort(sg.sf.q1,m.fmt)+m.unit+
            '  Q3: '+fmtShort(sg.sf.q3,m.fmt)+m.unit, 10, yp);
          yp += 7;
        });
      }
      
      // Histogramme strate
      if (includeChart && DREES_SNAP[m.id]) {
        var snap = DREES_SNAP[m.id];
        var strateData = STRATE.map(function(c){ return {code:c, name:(DEPTS[c]||c).slice(0,12), val:snap[c]||0}; });
        strateData.sort(function(a,b){return b.val-a.val;});
        
        yp += 4;
        doc.setTextColor(127, 179, 245);
        doc.setFontSize(8);
        doc.setFont(undefined, 'bold');
        doc.text('Strate — comparaison', 10, yp); yp += 4;
        
        var maxV2 = Math.max.apply(null, strateData.map(function(x){return x.val;}));
        var barH = 6, barGap = 2, barMaxW = 100;
        
        strateData.forEach(function(item) {
          var isAude = item.code === '11';
          var bw = (item.val / maxV2) * barMaxW;
          
          if (isAude) { doc.setFillColor(237, 125, 49); }
          else { doc.setFillColor(40, 70, 130); }
          doc.rect(55, yp, bw, barH, 'F');
          
          doc.setTextColor(isAude ? 237 : 150, isAude ? 125 : 170, isAude ? 49 : 200);
          doc.setFontSize(7);
          doc.setFont(undefined, isAude ? 'bold' : 'normal');
          doc.text(item.code+' '+item.name, 10, yp+4.5);
          doc.text(fmtShort(item.val,m.fmt)+(m.unit?' '+m.unit:''), 157, yp+4.5);
          
          yp += barH + barGap;
        });
      }
    });
    
    var filename = 'Observatoire_Aude_'+themes.join('_')+'_'+new Date().toISOString().slice(0,10)+'.pdf';
    doc.save(filename);
    status.textContent = '✅ PDF généré : '+filename;
    btn.textContent = '📄 Générer le PDF';
    btn.disabled = false;
    
  } catch(e) {
    status.textContent = '❌ Erreur: '+e.message;
    btn.textContent = '📄 Générer le PDF';
    btn.disabled = false;
  }
}
